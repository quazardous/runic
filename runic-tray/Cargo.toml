# runic-tray — Windows system-tray front-end over the `runic` core library.
#
# STANDALONE crate on purpose: it is NOT a member of the root build, so the
# Linux CLI build / `cargo test` at the repo root never touch it (its GUI deps
# need Windows and aren't fetched on the Linux box). Build it ON WINDOWS:
#   cd runic-tray && cargo build --release
# See ../docs/dev/windows-setup.md.
#
# Built and verified on Windows 11: the dep versions below (tao 0.30 /
# tray-icon 0.19 / windows 0.58) compile and run on both the GNU and MSVC
# toolchains.

[package]
name = "runic-tray"
version = "0.1.0"
edition = "2021"
description = "Windows system-tray front-end for runic"
license = "MIT OR Apache-2.0"

[[bin]]
name = "runic-tray"
path = "src/main.rs"

[dependencies]
runic = { path = ".." }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
anyhow = "1"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# GUI / tray (fetched + built on Windows; versions to confirm on first build):
tao = "0.30"
tray-icon = "0.19"

[target.'cfg(windows)'.dependencies]
# Auto-start registry write, %APPDATA% resolution, native toasts, etc.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
] }

[build-dependencies]
# Embed the executable icon (assets/runic.ico, via runic.rc) into the .exe
# resource table so Explorer / alt-tab / the installer show the Raidho rune.
# embed-resource links the compiled resource object directly (not through a
# static archive), avoiding the GNU-linker dead-strip that drops a winres
# resource. Still needs windres + gcc on PATH for the GNU toolchain. See build.rs.
embed-resource = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
