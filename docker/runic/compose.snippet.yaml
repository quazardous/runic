# Snippet à coller dans le `services:` du docker-compose qui héberge runic en
# sidecar. Contrat externe : SOCKS5 loopback sur 127.0.0.1:7777, le client
# consomme `socks5://127.0.0.1:7777`.
#
# runic n'a pas d'admin API dans cette release (statique). Si tu veux SIGHUP /
# reload à chaud / smart routing → version ultérieure.

services:
  runic:
    image: ghcr.io/quazardous/runic:0.1
    # Ou en build local :
    # build:
    #   context: ../runic           # adapter le chemin selon ton mono-repo
    #   dockerfile: Dockerfile
    container_name: runic
    restart: unless-stopped
    ports:
      - "127.0.0.1:7777:7777"     # loopback only — pas exposé LAN
    volumes:
      - ./docker/runic/runic.yaml:/etc/runic/runic.yaml:ro
    environment:
      DATAIMPULSE_LOGIN: ${DATAIMPULSE_LOGIN}
      DATAIMPULSE_PASSWORD: ${DATAIMPULSE_PASSWORD}
      RUNIC_LOG: "runic=info"
    # Pas de healthcheck dans cette release (pas d'endpoint santé) — le service
    # est si simple que `docker logs runic` + le smoke test curl suffisent.
    # Healthcheck à ajouter plus tard quand on a un /healthz.
