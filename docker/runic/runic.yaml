# runic — SOCKS5 local → DataImpulse upstream
#
# Listens loopback (binding to 0.0.0.0 inside the container; loopback exposure is
# enforced by docker-compose port mapping `127.0.0.1:7777:7777`), no auth on the
# SOCKS5 surface (loopback only), upstream HTTP CONNECT to DataImpulse static
# gateway with creds from env.
#
# `upstreams` is a pool keyed by name. Clients pick an upstream per session via
# the SOCKS5 username (v0.7, see docs/install/socks5-routing.md); traffic with no
# routing intent falls back to the entry named `default`.

listen:
  addr: "0.0.0.0:7777"
  auth: none

# Admin API (v0.6, see docs/install/admin-api.md): runtime/permanent config.
# runic starts it on 127.0.0.1:7778 by default — inside the container that is
# only reachable locally. To drive it from the host, bind 0.0.0.0 here and add
# `127.0.0.1:7778:7778` to the compose port mapping (same loopback stance as
# the SOCKS5 surface — the admin API has no auth).
#
# admin:
#   addr: "0.0.0.0:7778"

upstreams:
  default:
    kind: http_connect
    host: gw.dataimpulse.com
    port: 823
    auth:
      username_env: DATAIMPULSE_LOGIN
      password_env: DATAIMPULSE_PASSWORD

  # Forward-compat example (not used yet — declare extra named upstreams here
  # so a future routing release picks them up without a config rewrite):
  #
  # us-residential:
  #   kind: http_connect
  #   host: gw-us.example.com
  #   port: 823
  #   auth:
  #     username_env: USRES_LOGIN
  #     password_env: USRES_PASSWORD
