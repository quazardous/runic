# runic — SOCKS5 local → DataImpulse upstream
#
# Listens loopback (binding to 0.0.0.0 inside the container; loopback exposure is
# enforced by docker-compose port mapping `127.0.0.1:7878:7878`), no auth on the
# SOCKS5 surface (loopback only), upstream HTTP CONNECT to DataImpulse static
# gateway with creds from env.
#
# `upstreams` is a pool keyed by name. Clients pick an upstream per session via
# the SOCKS5 username (v0.7, see docs/install/socks5-routing.md); traffic with no
# routing intent falls back to the entry named `default`.
#
# The pool may also be left empty: runic boots with no providers and is then
# configured entirely over the admin API (sessions are declined cleanly until a
# route exists). A session with no matching upstream and no `default` is refused.

listen:
  addr: "0.0.0.0:7878"
  auth: none

# Admin API (v0.6, see docs/install/admin-api.md): runtime/permanent config.
# runic starts it on 127.0.0.1:48484 by default — inside the container that is
# only reachable locally. To drive it from the host, bind 0.0.0.0 here and add
# `127.0.0.1:48484:48484` to the compose port mapping (same loopback stance as
# the SOCKS5 surface — the admin API has no auth).
#
# admin:
#   addr: "0.0.0.0:48484"

upstreams:
  default:
    kind: http_connect
    host: gw.dataimpulse.com
    port: 823
    auth:
      username_env: DATAIMPULSE_LOGIN
      password_env: DATAIMPULSE_PASSWORD

  # Forward-compat example (not used yet — declare extra named upstreams here
  # so a future routing release picks them up without a config rewrite):
  #
  # us-residential:
  #   kind: http_connect
  #   host: gw-us.example.com
  #   port: 823
  #   auth:
  #     username_env: USRES_LOGIN
  #     password_env: USRES_PASSWORD

  # `direct` upstream — NOT proxied: runic TCP-connects straight to the target
  # with the local IP exposed. For dev/CI only (exercise the SOCKS5 path without
  # provider credentials). Allowed by default but never implicit — you must
  # declare this explicit `kind: direct` entry; set RUNIC_ALLOW_DIRECT=0 to
  # forbid direct outright (prod hardening). host/port/auth are not needed here.
  #
  # direct:
  #   kind: direct
