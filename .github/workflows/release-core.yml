# Publish a core/CLI (`runic`) release when a bare `vX.Y.Z` tag is pushed.
#
# Tag scheme (mirror of release-tray): the core/lib/CLI uses a bare `vX.Y.Z`
# while the tray uses `tray-vX.Y.Z`. The `v*` filter never matches `tray-v*`
# (different prefix), so the two release pipelines never collide.
#
# Builds a static x86_64 musl binary (no glibc version coupling — runs on any
# Linux) and publishes, all from that one binary:
#   - a portable `.tar.gz` (binary + README + licenses),
#   - a `.deb` (cargo-deb) and a `.rpm` (cargo-generate-rpm) — install
#     /usr/bin/runic, /etc/runic/runic.yaml, and a systemd unit,
# each with a SHA256 sidecar. Creating a public Release is irreversible, so this
# only ever runs from an explicit tag push.
#
# NOTE: the package version comes from Cargo.toml, not the tag — bump the crate
# version to match before tagging `vX.Y.Z`.
name: release-core

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the GitHub Release

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main

      - name: Install musl + packaging tools
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          cargo binstall -y cargo-deb cargo-generate-rpm

      - name: Build static binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl --bin runic

      - name: Build native packages (.deb + .rpm)
        run: |
          set -euo pipefail
          cargo deb --no-build --target x86_64-unknown-linux-musl
          cargo generate-rpm --target x86_64-unknown-linux-musl

      - name: Assemble + checksum + publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          pkg="runic-${version}-x86_64-linux-musl"
          mkdir -p "dist/${pkg}"

          # 1) portable static tarball
          cp target/x86_64-unknown-linux-musl/release/runic "dist/${pkg}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/${pkg}/"
          tar -C dist -czf "dist/${pkg}.tar.gz" "${pkg}"
          rm -rf "dist/${pkg}"

          # 2) native packages (built above)
          cp "$(find target -name 'runic_*_amd64.deb' | head -1)" dist/
          cp "$(find target -name 'runic-*.x86_64.rpm' | head -1)" dist/

          # 3) one SHA256 sidecar per published artifact
          ( cd dist && for f in *.tar.gz *.deb *.rpm; do sha256sum "$f" > "$f.sha256"; done )

          gh release create "${version}" \
            dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.sha256 \
            --title "runic ${version}" \
            --generate-notes
